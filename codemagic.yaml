workflows:
  vnf-android-debug:
    name: VNF Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.aicharacter.v3"
        GRADLE_VERSION: "8.14.1"

    scripts:
      - name: Verify project
        script: |
          set -e
          echo "Repository: $CM_BUILD_DIR"
          test -f "$CM_BUILD_DIR/settings.gradle"
          test -f "$CM_BUILD_DIR/build.gradle"
          test -f "$CM_BUILD_DIR/app/build.gradle"
          echo "VNF project structure found."

      - name: Set Android SDK location
        script: |
          set -e
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          elif [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > "$CM_BUILD_DIR/local.properties"
          fi
          java -version

      - name: Build VNF debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          if [ -x "./gradlew" ]; then
            echo "Using repository Gradle wrapper."
            ./gradlew --version
            ./gradlew :app:assembleDebug --stacktrace
          else
            echo "Gradle wrapper is missing. Using official Gradle ${GRADLE_VERSION} distribution."
            DIST_ROOT="$HOME/.vnf-gradle"
            DIST_DIR="$DIST_ROOT/gradle-${GRADLE_VERSION}"
            ZIP_FILE="$DIST_ROOT/gradle-${GRADLE_VERSION}-bin.zip"

            mkdir -p "$DIST_ROOT"

            if [ ! -x "$DIST_DIR/bin/gradle" ]; then
              curl -fL --retry 3 --retry-delay 3 \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                -o "$ZIP_FILE"
              rm -rf "$DIST_DIR"
              unzip -q "$ZIP_FILE" -d "$DIST_ROOT"
            fi

            "$DIST_DIR/bin/gradle" --version
            "$DIST_DIR/bin/gradle" :app:assembleDebug --stacktrace
          fi

          test -f "$CM_BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk"
          echo "APK BUILD SUCCESS: app/build/outputs/apk/debug/app-debug.apk"

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/**/*.apk
      - app/build/reports/**
