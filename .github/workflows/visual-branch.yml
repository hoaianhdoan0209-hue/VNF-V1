name: VNF Visual Branch Build

on:
  push:
    branches:
      - team/visual-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4

      - name: Setup Python for authored biome assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate replacement biome raster set
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python tools/generate_visual_biomes.py "$GITHUB_WORKSPACE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Visual V1 acceptance test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/visual-v1-test
          mkdir -p /tmp/visual-v1-test
          javac -d /tmp/visual-v1-test app/src/main/java/com/aicharacter/v3/MinimalHudLayout.java app/src/main/java/com/aicharacter/v3/VisualV1DevTest.java
          java -cp /tmp/visual-v1-test com.aicharacter.v3.VisualV1DevTest .

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.14.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "https://services.gradle.org/distributions/gradle-8.14.1-bin.zip" -o /tmp/gradle-8.14.1-bin.zip
          unzip -q /tmp/gradle-8.14.1-bin.zip -d /tmp
          /tmp/gradle-8.14.1/bin/gradle --version

      - name: Run debug unit tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gradle-8.14.1/bin/gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Capture real runtime visual QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/capture_visual_runtime.sh

      - name: Upload runtime visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VNF-visual-runtime-screenshots
          path: app/build/visual-runtime
          if-no-files-found: error

      - name: Upload VNF visual debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VNF-visual-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Persist approved generated biome rasters
        run: |
          git config user.name "vnf-visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/home_*.png app/src/main/res/drawable-nodpi/garden_*.png app/src/main/res/drawable-nodpi/lakeside_*.png app/src/main/res/drawable-nodpi/grove_*.png app/src/main/assets/visual/asset_manifest.json
          if git diff --cached --quiet; then
            echo "Biome raster assets already match generator."
          else
            git commit -m "visual: replace biome rasters with organic layered art"
            git push origin HEAD:team/visual-v1
          fi
