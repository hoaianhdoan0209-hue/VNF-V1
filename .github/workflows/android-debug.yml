name: VNF Android Debug APK

on:
  push:
    branches:
      - mong/god-session-ui
      - integration/v1.0.1
      - release/v1.0.1
      - release/v1.0.2
      - team/haru-intelligence-v1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout live VNF branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Visual V1 acceptance test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/visual-v1-test
          mkdir -p /tmp/visual-v1-test
          javac -d /tmp/visual-v1-test app/src/main/java/com/aicharacter/v3/MinimalHudLayout.java app/src/main/java/com/aicharacter/v3/VisualV1DevTest.java
          java -cp /tmp/visual-v1-test com.aicharacter.v3.VisualV1DevTest .

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "Using SDK: $SDK_ROOT"
          java -version

      - name: Download Gradle 8.14.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2             "https://services.gradle.org/distributions/gradle-8.14.1-bin.zip"             -o /tmp/gradle-8.14.1-bin.zip
          unzip -q /tmp/gradle-8.14.1-bin.zip -d /tmp
          /tmp/gradle-8.14.1/bin/gradle --version

      - name: Run regression tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gradle-8.14.1/bin/gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload VNF debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNF-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish VNF debug CI status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; DESCRIPTION="VNF Android debug tests and APK passed"; else STATE=failure; DESCRIPTION="VNF Android debug CI failed"; fi
          TARGET="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$(printf '{"state":"%s","context":"vnf/android-debug","description":"%s","target_url":"%s"}' "$STATE" "$DESCRIPTION" "$TARGET")"
