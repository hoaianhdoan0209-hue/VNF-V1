name: Character God Contract

on:
  push:
    branches:
      - team/character-god-v1
  pull_request:
    branches:
      - mong/god-session-ui

jobs:
  character-god-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Contract tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
