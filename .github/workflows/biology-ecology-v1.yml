name: VNF Biology Ecology Branch CI

on:
  push:
    branches:
      - team/biology-ecology-v1
  workflow_dispatch:

jobs:
  biology-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Download Gradle 8.14.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "https://services.gradle.org/distributions/gradle-8.14.1-bin.zip" -o /tmp/gradle-8.14.1-bin.zip
          unzip -q /tmp/gradle-8.14.1-bin.zip -d /tmp
      - name: Biology/ecology tests and debug build
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gradle-8.14.1/bin/gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Print JUnit failure details
        if: failure()
        shell: bash
        run: |
          REPORT="$(find app/build/test-results/testDebugUnitTest -type f -name '*BiologyEcologyRegressionTest*.xml' 2>/dev/null | head -n 1 || true)"
          if [ -n "$REPORT" ]; then cat "$REPORT"; else echo "No BiologyEcologyRegressionTest XML found"; fi
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
