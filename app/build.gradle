plugins { id 'com.android.application' }

def endpointRaw=(project.findProperty('VNF_GOD_ENDPOINT')?:System.getenv('VNF_GOD_ENDPOINT')?:'https://vnf-god-gemini-production.up.railway.app/god').toString(); def endpointEscaped=endpointRaw.replace('\\','\\\\').replace('"','\\"')
def contentOriginRaw=(project.findProperty('VNF_CONTENT_ORIGIN')?:System.getenv('VNF_CONTENT_ORIGIN')?:'').toString(); def contentOriginEscaped=contentOriginRaw.replace('\\','\\\\').replace('"','\\"')
def contentPublicKeyRaw=(project.findProperty('VNF_CONTENT_PUBLIC_KEY')?:System.getenv('VNF_CONTENT_PUBLIC_KEY')?:'').toString(); def contentPublicKeyEscaped=contentPublicKeyRaw.replace('\\','\\\\').replace('"','\\"').replaceAll('\\s+','')
def updateManifestRaw=(project.findProperty('VNF_UPDATE_MANIFEST')?:System.getenv('VNF_UPDATE_MANIFEST')?:'https://vnf-god-gemini-production.up.railway.app/update/manifest').toString(); def updateManifestEscaped=updateManifestRaw.replace('\\','\\\\').replace('"','\\"')
def releaseStore=(System.getenv('CM_KEYSTORE_PATH')?:System.getenv('VNF_RELEASE_STORE_FILE')); def releaseStorePassword=(System.getenv('CM_KEYSTORE_PASSWORD')?:System.getenv('VNF_KEYSTORE_PASSWORD')); def releaseAlias=(System.getenv('CM_KEY_ALIAS')?:System.getenv('VNF_KEY_ALIAS')); def releaseKeyPassword=(System.getenv('CM_KEY_PASSWORD')?:System.getenv('VNF_KEY_PASSWORD')); def releaseSigningConfigured=releaseStore&&releaseStorePassword&&releaseAlias&&releaseKeyPassword

android {
    namespace 'com.aicharacter.v3'; compileSdk 35
    defaultConfig { applicationId 'com.aicharacter.v3'; minSdk 26; targetSdk 35; versionCode 113; versionName '0.99.113'; buildConfigField 'String','VNF_GOD_ENDPOINT','"'+endpointEscaped+'"'; buildConfigField 'String','VNF_CONTENT_ORIGIN','"'+contentOriginEscaped+'"'; buildConfigField 'String','VNF_CONTENT_PUBLIC_KEY','"'+contentPublicKeyEscaped+'"'; buildConfigField 'String','VNF_UPDATE_MANIFEST','"'+updateManifestEscaped+'"' }
    buildFeatures { buildConfig true }
    signingConfigs { if(releaseSigningConfigured){ vnfRelease { storeFile file(releaseStore); storePassword releaseStorePassword; keyAlias releaseAlias; keyPassword releaseKeyPassword } } }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'; if(releaseSigningConfigured) signingConfig signingConfigs.vnfRelease } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

def verifyUpdaterReleaseInvariant=tasks.register('verifyUpdaterReleaseInvariant'){
    doLast {
        def mainFile=file('src/main/java/com/aicharacter/v3/MainActivity.java')
        def updater=file('src/main/java/com/aicharacter/v3/AppUpdateManager.java')
        def manifestFile=file('src/main/AndroidManifest.xml')
        def paths=file('src/main/res/xml/update_file_paths.xml')
        if(!mainFile.exists() || !updater.exists() || !manifestFile.exists()) throw new GradleException('Release blocked: updater source or manifest is missing.')
        def main=mainFile.getText('UTF-8')
        def updaterText=updater.getText('UTF-8')
        def manifest=manifestFile.getText('UTF-8')
        if(!main.contains('maybeCheckAppUpdate(true)') || !main.contains('maybeCheckAppUpdate(false)') || !main.contains('AppUpdateManager.checkAsync')) throw new GradleException('Release blocked: startup/resume updater check is not wired.')
        if(!updaterText.contains('downloadAndVerify') || !updaterText.contains('verifyPackageAndSigner') || !updaterText.contains('launchInstaller')) throw new GradleException('Release blocked: updater download/verification/install chain is incomplete.')
        if(!manifest.contains('android.permission.INTERNET') || !manifest.contains('android.permission.REQUEST_INSTALL_PACKAGES') || !manifest.contains('androidx.core.content.FileProvider') || !manifest.contains('.updatefiles')) throw new GradleException('Release blocked: updater manifest wiring is incomplete.')
        if(!paths.exists() || !paths.getText('UTF-8').contains('vnf-updates/')) throw new GradleException('Release blocked: updater FileProvider path is missing.')
        if(!updateManifestRaw.toLowerCase().startsWith('https://')) throw new GradleException('Release blocked: update manifest must use HTTPS.')
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach { dependsOn(verifyUpdaterReleaseInvariant); doFirst { if(!releaseSigningConfigured) throw new GradleException('Stable VNF release signing is not configured. Refusing to create an unsigned/self-update-incompatible release.') } }

dependencies { implementation 'androidx.core:core:1.15.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }

// Read-only source snapshot for the online God technical-diagnostics channel.
def vnfGodCodeAssetsDir=file("$buildDir/generated/vnfGodCodeAssets")
def generateVnfGodCodeSnapshot=tasks.register('generateVnfGodCodeSnapshot'){def sourceTree=fileTree('src/main/java/com/aicharacter/v3'){include '**/*.java'};inputs.files(sourceTree);outputs.file(file("$vnfGodCodeAssetsDir/god_world_source_snapshot.txt"));doLast{def output=file("$vnfGodCodeAssetsDir/god_world_source_snapshot.txt");output.parentFile.mkdirs();output.withWriter('UTF-8'){writer->writer<<'VNF GOD CODE VISION SNAPSHOT v1\nMODE=READ_ONLY_BUILD_SNAPSHOT\nGenerated from the exact Java sources compiled into this APK.\n\n';sourceTree.files.sort{a,b->a.name<=>b.name}.each{f->writer<<"===== FILE: ${f.name} =====\n"<<f.getText('UTF-8')<<'\n\n'}}}}
android.sourceSets.main.assets.srcDir(vnfGodCodeAssetsDir)
// The generated directory is part of the main assets source set, so every Android
// task that analyzes or packages assets must wait for the snapshot producer.
afterEvaluate {
    tasks.matching { t ->
        def n=t.name.toLowerCase()
        (n.contains('assets') || n.contains('lint')) && n != 'generatevnfgodcodesnapshot'
    }.configureEach { dependsOn(generateVnfGodCodeSnapshot) }
}
