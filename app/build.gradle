plugins {
    id 'com.android.application'
}

def endpointRaw = (project.findProperty('VNF_GOD_ENDPOINT') ?: System.getenv('VNF_GOD_ENDPOINT') ?: '').toString()
def endpointEscaped = endpointRaw.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.aicharacter.v3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aicharacter.v3'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '0.99C-foundation'
        buildConfigField 'String', 'VNF_GOD_ENDPOINT', '"' + endpointEscaped + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
