plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aicharacter.v3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aicharacter.v3'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '0.99C-foundation'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
